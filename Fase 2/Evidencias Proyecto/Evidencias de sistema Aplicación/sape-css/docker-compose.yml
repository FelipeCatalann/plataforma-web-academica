services:
  db:
    image: postgres:16
    container_name: sistema_escolar_db
    restart: always
    environment:
      POSTGRES_DB: sistema_escolar
      POSTGRES_USER: admin_db
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
